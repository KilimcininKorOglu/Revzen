name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint
        run: |
          brew install swiftlint
          make lint
      - name: Test
        run: make test
      - name: Build universal app bundle
        run: |
          make app SIGN_IDENTITY=-
          lipo -info build/Revzen.app/Contents/MacOS/Revzen | grep -q "x86_64 arm64\|arm64 x86_64"
